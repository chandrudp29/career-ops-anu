# Portal Scanner Configuration — Anu C Nanda (Legal Counsel search)
# Isolated, standalone install: run with `node scan.mjs` from inside
# career-ops-anu/ — data/scan-history.tsv and data/pipeline.md are local here.
# Board tokens below were verified directly against live Greenhouse/Lever/Ashby
# JSON APIs (curl HTTP 200 + non-empty job list), not from search-engine
# snippets or aggregator blogs, which we found to be months stale.

title_filter:
  positive:
    - "Legal Counsel"
    - "Corporate Counsel"
    - "Commercial Counsel"
    - "Legal"
    - "Company Secretary"
    - "Compliance Counsel"
    - "Compliance Manager"    # added 2026-09-28 — caught Meesho's Associate
                              # Compliance Manager, which "Compliance Counsel"
                              # alone missed during the unfiltered audit
    - "Privacy Counsel"       # added 2026-09-28 — matches her CIPP/data-privacy
    - "Data Protection Officer"
    - "Privacy Manager"
  negative:
    - "General Counsel"
    - "Chief Legal"
    - "Chief Compliance"
    - "VP"
    - "Vice President"
    - "Head of Legal"
    - "Executive"
    - "Intern"
    - "Paralegal Intern"

location_filter:
  always_allow:
    - "Bengaluru"
    - "Bangalore"
  allow:
    - "Bengaluru"
    - "Bangalore"
    - "Hybrid"
    - "India"

